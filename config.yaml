application:
  name: Finnie
  version: 0.1.0
  description: Educational personal finance assistant
  default_currency: INR
  default_market: NSE
  log_level: INFO

llm:
  provider: google
  model: gemini-3.5-flash-lite
  temperature: 0.7
  max_output_tokens: 2048

retrieval:
  provider: chroma
  client_type: PersistedClient # PersisistentClient or InMemoryClient or CloudClient
  knowledge_base_path: knowledge_base/articles
  db_directory_path: src/data/vector_store
  collection_name: finnie_finance_education
  top_k: 5

market_data:
  provider: alpha_vantage
  cache_ttl_minutes: 15
  request_timeout_seconds: 10

safety:
  education_only: true
  show_citations: true
  show_data_timestamps: true
